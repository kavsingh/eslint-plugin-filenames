name: Test and lint

on:
  - push
  - workflow_call

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
        if: ${{ matrix.node == 20 }}

      - run: pnpm test:coverage
        if: ${{ matrix.node != 20 }}

      - run: pnpm build && pnpm lint
